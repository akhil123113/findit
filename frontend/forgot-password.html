<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your password — FindIt</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231b6ca8' stroke-width='2.2' stroke-linecap='round'%3E%3Ccircle cx='11' cy='11' r='7'/%3E%3Cpath d='M20 20l-3.5-3.5'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="forgot">
    <div id="site-header"></div>

    <main class="auth-wrap" style="grid-template-columns: 1fr">
      <section class="auth-main" style="padding: 60px 24px">
        <div class="auth-card">
          <h1 id="forgotHeading">Forgot your password?</h1>
          <p class="sub" id="forgotSub">
            Enter the email you registered with and we will send you a secure reset link.
          </p>

          <div class="alert hidden" id="authAlert" role="alert"></div>

          <!-- step 1: request a reset link -->
          <form id="forgotForm" novalidate>
            <div class="form-group">
              <label for="email">Email address <span class="req">*</span></label>
              <input class="input" id="email" name="email" type="email" placeholder="you@findit.edu" autocomplete="email" required />
              <div class="field-error"></div>
            </div>
            <button class="btn btn-primary btn-block btn-lg" type="submit" id="forgotSubmit">
              Send reset link
            </button>
          </form>

          <!-- step 2: set a new password -->
          <form id="resetForm" class="hidden" novalidate>
            <div class="form-group">
              <label for="password">New password <span class="req">*</span></label>
              <div class="input-group">
                <input class="input" id="password" name="password" type="password" placeholder="At least 6 characters" autocomplete="new-password" required />
                <button class="toggle-pass" type="button" data-toggle="password" aria-label="Show password">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
              <div class="field-error"></div>
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm new password <span class="req">*</span></label>
              <input class="input" id="confirmPassword" name="confirmPassword" type="password" placeholder="Repeat the password" autocomplete="new-password" required />
              <div class="field-error"></div>
            </div>
            <button class="btn btn-primary btn-block btn-lg" type="submit" id="resetSubmit">
              Update password
            </button>
          </form>

          <div class="alert alert-info mt-2 hidden" id="devLinkBox"></div>

          <p class="auth-foot">
            Remembered it? <a href="/login.html">Back to login</a>
          </p>
        </div>
      </section>
    </main>

    <div id="site-footer" style="margin-top: 0"></div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
